<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard - Storybali Undangan</title>
  <meta name="description" content="Dashboard admin untuk Storybali Undangan — pengelolaan undangan dan statistik" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </noscript>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- External libs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="admin-page">
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" aria-label="Toggle menu" title="Toggle menu">☰</button>
    <div class="brand">
      <img src="IMG_6302%20(2).JPG" alt="Storybali" class="brand-logo">
      <span class="brand-name">Storybali Undangan</span>
    </div>

    <div class="topbar-actions">
      <button id="dark-toggle" class="btn small">Mode Gelap</button>
      <a href="index.html" class="btn small ghost">Lihat Situs</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar admin">
      <nav>
        <ul>
          <li><a href="#" class="active">Dashboard</a></li>
          <li><a href="#">Undangan</a></li>
          <li><a href="#">Pemesanan</a></li>
          <li><a href="#">Pengguna</a></li>
          <li><a href="#">Pengaturan</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <section class="page-header">
        <h1>Dashboard</h1>
        <p class="muted">Ringkasan performa dan aktivitas terbaru</p>
      </section>

      <section class="cards-grid">
        <article class="card">
          <h3>Pesanan Hari Ini</h3>
          <p class="metric">12</p>
        </article>
        <article class="card">
          <h3>Total Undangan</h3>
          <p class="metric">86</p>
        </article>
        <article class="card">
          <h3>Pengunjung</h3>
          <p class="metric">1.2k</p>
        </article>
      </section>

      <section class="panel">
        <h2>Statistik Kunjungan</h2>
        <div class="chart-wrapper">
          <canvas id="visitorsChart" aria-label="Grafik kunjungan" role="img"></canvas>
        </div>
        <div class="panel-actions">
          <button id="exportPdf" class="btn">Export PDF</button>
        </div>
      </section>

      <footer class="admin-footer">
        <small>© Storybali Undangan</small>
      </footer>
    </main>
  </div>

  <script>
    // Menu toggle (mobile)
    document.getElementById('menu-toggle').addEventListener('click', function () {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // Dark mode toggle
    document.getElementById('dark-toggle').addEventListener('click', function () {
      document.documentElement.classList.toggle('dark-mode');
    });

    // Example Chart.js init (simple, responsive)
    const ctx = document.getElementById('visitorsChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
        datasets: [{
          label: 'Kunjungan',
          data: [120, 200, 150, 220, 300, 250, 270],
          borderColor: 'rgba(90,107,89,0.9)',
          backgroundColor: 'rgba(90,107,89,0.12)',
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });

    // Export PDF (simple)
    document.getElementById('exportPdf').addEventListener('click', function () {
      const element = document.querySelector('.main-content');
      html2pdf().from(element).save('dashboard.pdf');
    });
  </script>
</body>
</html>
